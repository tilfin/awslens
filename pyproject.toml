[project]
name = "awslens"
version = "0.1.0"
description = "Collect and diff AWS resource snapshots for architecture visibility"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.47",
    "pyyaml>=6.0.3",
]

[project.scripts]
awslens = "awslens:main"
awslens-diff = "awslens_diff:main"
